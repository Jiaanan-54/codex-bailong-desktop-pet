name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.10.1)'
        required: false
        default: 'v1.10.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-enhanced.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-enhanced.txt
          pip install pyinstaller

      - name: Build Windows App & Installer
        shell: pwsh
        run: |
          # 1. Build main application directory
          pyinstaller --noconfirm --onedir --windowed --name BailongEnhanced --icon app/branding/bailong.ico --add-data "app;app" --paths "app" app/enhanced.py

          # Prepare output release package structure
          $dist = "dist/BailongEnhanced"
          New-Item -ItemType Directory -Path "$dist/app" -Force
          Copy-Item -Path "app/material_catalog.json" -Destination "$dist/app/material_catalog.json" -Force
          Copy-Item -Path "app/book_catalog.json" -Destination "$dist/app/book_catalog.json" -Force
          Copy-Item -Path "app/branding" -Destination "$dist/app/branding" -Recurse -Force
          Copy-Item -Path "app/fonts" -Destination "$dist/app/fonts" -Recurse -Force
          Copy-Item -Path "app/licenses" -Destination "$dist/app/licenses" -Recurse -Force
          Copy-Item -Path "app/sounds" -Destination "$dist/app/sounds" -Recurse -Force

          New-Item -ItemType Directory -Path "$dist/outputs/白龙桌宠素材" -Force
          Copy-Item -Path "outputs/白龙桌宠素材/素材清单.json" -Destination "$dist/outputs/白龙桌宠素材/素材清单.json" -Force

          # 2. Package dist/BailongEnhanced into payload.zip for installer
          New-Item -ItemType Directory -Path "build" -Force
          $payloadZip = "build/payload.zip"
          Compress-Archive -Path "$dist/*" -DestinationPath $payloadZip -Force

          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($version) -or -not ($version -like "v*")) {
            $version = "${{ github.event.inputs.tag_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "v1.10.1"
          }

          # 3. Build Windows Installer (.exe) with embedded payload.zip
          $installerBaseName = "白龙桌宠-$version-一键部署"
          pyinstaller --noconfirm --windowed --onefile --name $installerBaseName --icon app/branding/bailong.ico --paths "app" --add-data "$payloadZip;." app/installer.py

          $installerExe = "dist/$installerBaseName.exe"
          Copy-Item -Path $installerExe -Destination "$installerBaseName.exe" -Force
          Copy-Item -Path $installerExe -Destination "bailong-desktop-pet-$version-setup.exe" -Force

          # 4. Create Windows user distribution zip (containing installer and quick deployment docs)
          $bundleFolder = "bailong-desktop-pet-$version-windows-x64"
          New-Item -ItemType Directory -Path $bundleFolder -Force
          Copy-Item -Path $installerExe -Destination "$bundleFolder/$installerBaseName.exe" -Force
          if (Test-Path "发布说明/安装管理.cmd") { Copy-Item -Path "发布说明/安装管理.cmd" -Destination "$bundleFolder/安装管理.cmd" -Force }
          if (Test-Path "发布说明/快速部署说明.txt") { Copy-Item -Path "发布说明/快速部署说明.txt" -Destination "$bundleFolder/快速部署说明.txt" -Force }
          if (Test-Path "发布说明/新增功能说明.txt") { Copy-Item -Path "发布说明/新增功能说明.txt" -Destination "$bundleFolder/新增功能说明.txt" -Force }
          if (Test-Path "发布说明/迭代历史.txt") { Copy-Item -Path "发布说明/迭代历史.txt" -Destination "$bundleFolder/迭代历史.txt" -Force }
          if (Test-Path "docs/releases/$version.md") { Copy-Item -Path "docs/releases/$version.md" -Destination "$bundleFolder/本次更新说明.md" -Force }

          $zipName = "bailong-desktop-pet-$version-windows-x64.zip"
          Compress-Archive -Path "$bundleFolder/*" -DestinationPath $zipName -Force

          # Also create portable zip
          $portableZip = "bailong-desktop-pet-$version-windows-portable.zip"
          Compress-Archive -Path "$dist/*" -DestinationPath $portableZip -Force

          $filesToCheck = @("$installerBaseName.exe", "bailong-desktop-pet-$version-setup.exe", $zipName, $portableZip)
          foreach ($f in $filesToCheck) {
            if (Test-Path $f) {
              $sha = (Get-FileHash -Path $f -Algorithm SHA256).Hash
              "$sha  $f" | Out-File -FilePath "$f.sha256" -Encoding utf8
            }
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-windows
          path: |
            *.zip
            *.exe
            *.sha256

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-enhanced.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-enhanced.txt
          pip install pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed --name BailongEnhanced --icon app/branding/bailong.png --add-data "app:app" --paths "app" app/enhanced.py

          BUNDLE="dist/BailongEnhanced.app"
          RESOURCES="$BUNDLE/Contents/Resources"
          mkdir -p "$RESOURCES/app"
          mkdir -p "$RESOURCES/outputs/白龙桌宠素材"

          cp app/material_catalog.json "$RESOURCES/app/"
          cp app/book_catalog.json "$RESOURCES/app/"
          cp -r app/branding "$RESOURCES/app/"
          cp -r app/fonts "$RESOURCES/app/"
          cp -r app/licenses "$RESOURCES/app/"
          cp -r app/sounds "$RESOURCES/app/"
          cp "outputs/白龙桌宠素材/素材清单.json" "$RESOURCES/outputs/白龙桌宠素材/"

          # 对组装后的 .app Bundle 重新进行自签名（Ad-hoc Signing），避免文件增补破坏签名一致性
          codesign --force --deep --sign - "$BUNDLE"

          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            VERSION="${{ github.event.inputs.tag_name || 'v1.10.1' }}"
          fi

          ZIP_NAME="bailong-desktop-pet-$VERSION-macos.zip"
          cd dist && zip -r -y "../$ZIP_NAME" BailongEnhanced.app && cd ..
          shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-macos
          path: |
            *.zip
            *.sha256

  publish-release:
    needs: [build-windows, build-macos]
    if: always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-release-assets
          merge-multiple: true

      - name: Determine Tag and Release Notes
        id: get_tag
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag_name || 'v1.10.1' }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          if [ -f "docs/releases/${TAG}.md" ]; then
            echo "BODY_PATH=docs/releases/${TAG}.md" >> $GITHUB_OUTPUT
          elif [ -f "docs/releases/v1.10.1.md" ]; then
            echo "BODY_PATH=docs/releases/v1.10.1.md" >> $GITHUB_OUTPUT
          else
            echo "BODY_PATH=docs/releases/v1.10.0.md" >> $GITHUB_OUTPUT
          fi

      - name: Generate Global SHA256SUMS
        run: |
          cd all-release-assets
          sha256sum *.zip *.exe > SHA256SUMS.txt 2>/dev/null || sha256sum *.zip > SHA256SUMS.txt || true
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG }}
          name: 白龙桌宠 ${{ steps.get_tag.outputs.TAG }}
          body_path: ${{ steps.get_tag.outputs.BODY_PATH }}
          files: |
            all-release-assets/*.zip
            all-release-assets/*.exe
            all-release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
