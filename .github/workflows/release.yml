name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.10.0)'
        required: false
        default: 'v1.10.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-enhanced.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-enhanced.txt
          pip install pyinstaller

      - name: Build Windows Portable App
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name BailongEnhanced --icon app/branding/bailong.ico --add-data "app;app" --paths "app" app/enhanced.py

          # Prepare output release package structure
          $dist = "dist/BailongEnhanced"
          Copy-Item -Path "app/material_catalog.json" -Destination "$dist/app/material_catalog.json" -Force
          Copy-Item -Path "app/book_catalog.json" -Destination "$dist/app/book_catalog.json" -Force
          Copy-Item -Path "app/branding" -Destination "$dist/app/branding" -Recurse -Force
          Copy-Item -Path "app/fonts" -Destination "$dist/app/fonts" -Recurse -Force
          Copy-Item -Path "app/licenses" -Destination "$dist/app/licenses" -Recurse -Force
          Copy-Item -Path "app/sounds" -Destination "$dist/app/sounds" -Recurse -Force

          New-Item -ItemType Directory -Path "$dist/outputs/白龙桌宠素材" -Force
          Copy-Item -Path "outputs/白龙桌宠素材/素材清单.json" -Destination "$dist/outputs/白龙桌宠素材/素材清单.json" -Force

          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($version) -or -not ($version -like "v*")) {
            $version = "${{ github.event.inputs.tag_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "v1.10.0"
          }
          $zipName = "bailong-desktop-pet-$version-windows-x64.zip"
          Compress-Archive -Path "$dist/*" -DestinationPath $zipName -Force

          $sha = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          "$sha  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding utf8

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-windows
          path: |
            *.zip
            *.sha256

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-enhanced.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-enhanced.txt
          pip install pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed --name BailongEnhanced --icon app/branding/bailong.png --add-data "app:app" --paths "app" app/enhanced.py

          BUNDLE="dist/BailongEnhanced.app"
          RESOURCES="$BUNDLE/Contents/Resources"
          mkdir -p "$RESOURCES/app"
          mkdir -p "$RESOURCES/outputs/白龙桌宠素材"

          cp app/material_catalog.json "$RESOURCES/app/"
          cp app/book_catalog.json "$RESOURCES/app/"
          cp -r app/branding "$RESOURCES/app/"
          cp -r app/fonts "$RESOURCES/app/"
          cp -r app/licenses "$RESOURCES/app/"
          cp -r app/sounds "$RESOURCES/app/"
          cp "outputs/白龙桌宠素材/素材清单.json" "$RESOURCES/outputs/白龙桌宠素材/"

          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            VERSION="${{ github.event.inputs.tag_name || 'v1.10.0' }}"
          fi

          ZIP_NAME="bailong-desktop-pet-$VERSION-macos.zip"
          cd dist && zip -r -y "../$ZIP_NAME" BailongEnhanced.app && cd ..
          shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-macos
          path: |
            *.zip
            *.sha256

  publish-release:
    needs: [build-windows, build-macos]
    if: always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-release-assets
          merge-multiple: true

      - name: Determine Tag
        id: get_tag
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.event.inputs.tag_name || 'v1.10.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Global SHA256SUMS
        run: |
          cd all-release-assets
          sha256sum *.zip > SHA256SUMS.txt || true
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG }}
          name: 白龙桌宠 ${{ steps.get_tag.outputs.TAG }} - 添加 Codex 账户切换功能
          body_path: docs/releases/v1.10.0.md
          files: |
            all-release-assets/*.zip
            all-release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
